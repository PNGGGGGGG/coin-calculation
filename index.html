<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算機 </title>

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@PNG_Mirrativ">
    <meta property="og:url" content="https://pnggggggg.github.io/coin-calculation/">
    <meta property="og:title" content="還元コイン＋スターズポイント計算機">
    <meta property="og:description" content="ミラティブの還元コインとスターズポイントを素早く計算できるプロ仕様ツール。">
    <meta property="og:image" content="https://pnggggggg.github.io/coin-calculation//1000054265.png">

    <style>
        :root {
            --primary-color: #27CAB1;
            --primary-gradient: linear-gradient(135deg, #27CAB1 0%, #1ea894 100%);
            --coin-gold: #ffd700;
            --coin-orange: #ffa500;
            --star-gradient: linear-gradient(45deg, #cfa8ff, #74d8ff);
            --bg-color: #f0f4f3;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --shadow-premium: 0 15px 35px rgba(0, 0, 0, 0.1);
            --transition-smooth: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ヘッダー --- */
        header {
            width: 100%;
            height: 64px;
            background: rgba(39, 202, 177, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .menu-trigger {
            position: absolute;
            left: 15px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .menu-trigger:active { transform: scale(0.9); }

        h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.05em; }

        /* --- サイドメニュー --- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            z-index: 1100;
        }
        .overlay.active { opacity: 1; visibility: visible; backdrop-filter: blur(5px); }

        nav.side-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: white;
            transform: translateX(-105%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 1200;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 20px 0 50px rgba(0,0,0,0.1);
        }
        nav.side-menu.active { transform: translateX(0); }

        .menu-header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--primary-color);
        }

        .menu-item {
            padding: 18px 20px;
            margin-bottom: 12px;
            border-radius: 16px;
            background: #f8f9fa;
            color: var(--text-main);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .menu-item:hover {
            background: white;
            color: var(--primary-color);
            transform: translateX(8px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--primary-color);
        }

        .creator-link {
            text-align: center;
            padding-bottom: 20px;
        }
        .creator-link a {
            color: #4dd0e1;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .creator-link a:hover { opacity: 0.7; }

        /* --- メインコンテンツ --- */
        main {
            width: 100%;
            max-width: 460px;
            margin: 100px auto 40px;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 35px 20px;
            box-shadow: var(--shadow-premium);
            animation: pageIn 0.5s ease-out forwards;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page { display: none; }
        .page.active { display: block; }

        /* --- 入力エリア --- */
        .input-group { margin-bottom: 25px; }
        .input-row {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 12px 15px;
            border-radius: 15px;
            border: 1px solid #e0e0e0;
            transition: var(--transition-smooth);
            overflow: hidden;
        }
        .input-row:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 5px 15px rgba(39, 202, 177, 0.1);
        }

        .coin-label {
            display: flex;
            align-items: center;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .coin-icon {
            width: 32px; height: 32px;
            background: var(--coin-gold);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--coin-orange);
            margin-right: 8px;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .star-icon {
            width: 32px; height: 32px;
            background: var(--star-gradient);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white;
            text-shadow: 0 0 3px rgba(106, 46, 160, 0.5);
            margin-right: 8px;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .label-text {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-sub);
            white-space: nowrap;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: calc(1rem + 1vw); 
            font-weight: 700;
            text-align: right;
            background: transparent;
            color: var(--text-main);
            width: 100%;
            min-width: 0; 
        }

        /* --- 結果表示 --- */
        .result-panel {
            background: #ffffff;
            border: 2px solid #f0f0f0;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            margin-top: 30px;
        }

        .res-label { font-size: 0.9rem; font-weight: 800; color: var(--text-sub); margin-bottom: 10px; display: block; }
        
        .result-value {
            font-size: 2rem;
            font-weight: 900;
            color: yellow;
            text-shadow:
                -1px -1px 0 orange, 1px -1px 0 orange,
                -1px 1px 0 orange, 1px 1px 0 orange,
                0 4px 10px rgba(255, 165, 0, 0.3);
            margin: 5px 0;
            word-wrap: break-word;
        }

        .result-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .grid-row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; gap: 10px; }
        .grid-row .val { color: var(--coin-orange); font-size: 1.2rem; text-align: right; }

        /* --- ボタン --- */
        .btn-clear {
            margin-top: 25px;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 20px rgba(39, 202, 177, 0.2);
        }
        .btn-clear:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(39, 202, 177, 0.3); }
    </style>
</head>
<body>

    <header>
        <button class="menu-trigger" onclick="toggleMenu()">≡</button>
        <h1 id="headerTitle">還元コイン計算機</h1>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="side-menu" id="sideMenu">
        <div class="menu-top">
            <div class="menu-header">メニュー</div>
            <div class="menu-item" onclick="switchPage('coin')">🪙 還元コイン計算</div>
            <div class="menu-item" onclick="switchPage('stars')">⭐ スターズポイント計算</div>
        </div>
        <div class="creator-link">
            <a href="https://x.com/PNG_Mirrativ" target="_blank">【製作者:ﾍﾟﾝｷﾞﾝ】</a>
        </div>
    </nav>

    <main>
        <div class="card">
            <section id="coinPage" class="page active">
                <div class="input-group">
                    <div class="input-row">
                        <div class="coin-label">
                            <div class="coin-icon">M</div>
                            <span class="label-text">無償コイン</span>
                        </div>
                        <input type="number" id="freeCoin" placeholder="0" oninput="limitVal(this); calcCoin()">
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="coin-label">
                            <div class="coin-icon">M</div>
                            <span class="label-text">有償コイン</span>
                        </div>
                        <input type="number" id="paidCoin" placeholder="0" oninput="limitVal(this); calcCoin()">
                    </div>
                </div>
                <div class="result-panel">
                    <span class="res-label">【還元コイン】</span>
                    <div class="result-value" id="coinRes">0コイン</div>
                </div>
                <button class="btn-clear" onclick="clearInputs('coin')">CLEAR</button>
            </section>

            <section id="starsPage" class="page">
                <div class="input-group">
                    <div class="input-row">
                        <div class="coin-label">
                            <div class="star-icon">★</div>
                            <span class="label-text">現在のポイント</span>
                        </div>
                        <input type="number" id="currStar" placeholder="0" oninput="limitVal(this); calcStars()">
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="coin-label">
                            <div class="star-icon">★</div>
                            <span class="label-text">目標のポイント</span>
                        </div>
                        <input type="number" id="targetStar" placeholder="0" oninput="limitVal(this); calcStars()">
                    </div>
                </div>
                <div class="result-panel">
                    <span class="res-label">【必要コイン数】</span>
                    <div class="result-grid">
                        <div class="grid-row">
                            <span>無償時</span>
                            <span class="val" id="freeNeed">0コイン</span>
                        </div>
                        <div class="grid-row">
                            <span>有償時</span>
                            <span class="val" id="paidNeed">0コイン</span>
                        </div>
                    </div>
                </div>
                <button class="btn-clear" onclick="clearInputs('stars')">CLEAR</button>
            </section>
        </div>
    </main>

    <script>
        const MAX = 100000000;
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        const headerTitle = document.getElementById('headerTitle');

        function toggleMenu() {
            sideMenu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function switchPage(key) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            if(key === 'coin') {
                document.getElementById('coinPage').classList.add('active');
                headerTitle.textContent = '還元コイン計算機';
            } else {
                document.getElementById('starsPage').classList.add('active');
                headerTitle.textContent = 'スターズポイント計算';
            }
            toggleMenu();
        }

        function limitVal(el) {
            if (el.value > MAX) el.value = MAX;
            if (el.value < 0) el.value = 0;
        }

        function fmt(n) { return new Intl.NumberFormat('ja-JP').format(n); }

        function calcCoin() {
            const f = Number(document.getElementById('freeCoin').value) || 0;
            const p = Number(document.getElementById('paidCoin').value) || 0;
            document.getElementById('coinRes').textContent = fmt(Math.floor(f * 0.3 + p * 0.9)) + "コイン";
        }

        function calcStars() {
            const c = Number(document.getElementById('currStar').value) || 0;
            const t = Number(document.getElementById('targetStar').value) || 0;
            const diff = Math.max(0, t - c);
            document.getElementById('freeNeed').textContent = fmt(Math.floor(diff * 3.333333333)) + "コイン";
            document.getElementById('paidNeed').textContent = fmt(Math.floor(diff)) + "コイン";
        }

        function clearInputs(key) {
            if(key === 'coin') {
                document.getElementById('freeCoin').value = '';
                document.getElementById('paidCoin').value = '';
                calcCoin();
            } else {
                document.getElementById('currStar').value = '';
                document.getElementById('targetStar').value = '';
                calcStars();
            }
        }
    </script>
</body>
</html>
